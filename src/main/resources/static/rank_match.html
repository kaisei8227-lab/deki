<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic Duel - ランクマッチ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'EB Garamond', serif;
            background: #09060c;
            color: #e0d8e8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* --- ヘッダー --- */
        header {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: rgba(15, 10, 23, 0.85);
            border-bottom: 1px solid #3d2f4d;
            z-index: 10;
        }
        .btn-back {
            background: rgba(45, 27, 78, 0.6);
            border: 1px solid #c9a050;
            color: #c9a050;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: #c9a050;
            color: #09060c;
        }
        .header-title {
            margin-left: 15px;
            font-family: 'Cinzel Decorative', serif;
            color: #c9a050;
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* --- メインコンテンツ領域 --- */
        .main-container {
            flex: 1;
            display: flex;
            margin: 15px 30px;
            background: rgba(20, 14, 30, 0.9);
            border: 1px solid #5a486e;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(201, 160, 80, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* 左側ナビゲーションタブ */
        .sidebar-tabs {
            width: 160px;
            background: rgba(12, 8, 18, 0.95);
            border-right: 1px solid #4a3e56;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }
        .tab-item {
            padding: 25px 10px;
            text-align: center;
            color: #8c78a0;
            cursor: pointer;
            border-bottom: 1px solid #2a1f35;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .tab-item.active {
            background: linear-gradient(90deg, rgba(201, 160, 80, 0.3) 0%, rgba(201, 160, 80, 0) 100%);
            border-left: 4px solid #c9a050;
            color: #f1e6cf;
            font-weight: bold;
        }
        .tab-icon { font-size: 24px; }

        /* 中央エリア：モード詳細＆デッキ指定 */
        .center-section {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
        }
        .mode-header h3 {
            font-family: 'Cinzel Decorative', serif;
            color: #c9a050;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .mode-desc {
            font-size: 13px;
            color: #a792ba;
            margin-bottom: 15px;
        }

        /* フォーマット切替（ローテーション / アンリミテッド） */
        .format-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 200px;
            margin-bottom: 20px;
        }
        .format-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: rgba(30, 20, 45, 0.8);
            border: 1px solid #5a486e;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: #d0c4de;
            transition: all 0.2s;
        }
        .format-btn.active {
            background: linear-gradient(90deg, #2b589a 0%, #172d54 100%);
            border-color: #5c96f5;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(92, 150, 245, 0.4);
        }
        .radio-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #8c78a0;
        }
        .format-btn.active .radio-dot {
            border-color: #5c96f5;
            background: #5c96f5;
            box-shadow: 0 0 5px #5c96f5;
        }

        /* 下部設定エリア（デッキ＆ステージ） */
        .settings-bottom {
            display: flex;
            gap: 20px;
            align-items: flex-end;
        }
        .setting-box {
            background: rgba(15, 10, 23, 0.8);
            border: 1px solid #4a3e56;
            border-radius: 6px;
            padding: 10px;
        }
        .setting-label {
            font-size: 12px;
            color: #c9a050;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-confirm {
            background: #2b1a3a;
            border: 1px solid #c9a050;
            color: #c9a050;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .deck-preview-card, .stage-preview-card {
            width: 140px;
            height: 60px;
            background: #181124;
            border: 1px solid #6c5383;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #f1e6cf;
        }

        /* 右側エリア：ランク＆MP・バトルボタン */
        .right-section {
            width: 320px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border-left: 1px solid rgba(74, 62, 86, 0.4);
            z-index: 2;
        }
        .rank-info { text-align: center; margin-top: 10px; }
        .rank-badge {
            width: 90px;
            height: 90px;
            margin: 0 auto 10px;
            background: radial-gradient(circle, #e2be6e 0%, #704d08 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 0 20px rgba(226, 190, 110, 0.5);
            border: 2px solid #fff;
        }
        .rank-name {
            font-family: 'Cinzel Decorative', serif;
            font-size: 22px;
            color: #f1e6cf;
            text-shadow: 0 0 8px rgba(241, 230, 207, 0.5);
        }

        /* MPゲージ */
        .mp-container { width: 100%; margin-top: 15px; }
        .mp-header { display: flex; justify-content: space-between; font-size: 12px; color: #c9a050; margin-bottom: 4px; }
        .mp-bar-bg { width: 100%; height: 8px; background: #150b21; border: 1px solid #4a3e56; border-radius: 4px; overflow: hidden; }
        .mp-bar-fill { width: 58%; height: 100%; background: linear-gradient(90deg, #3282f6 0%, #00d2ff 100%); box-shadow: 0 0 8px #00d2ff; }
        .mp-next { text-align: right; font-size: 10px; color: #8c78a0; margin-top: 3px; }

        /* 円形バトルボタン */
        .battle-btn-container { margin-bottom: 10px; }
        .btn-battle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #1e62d0 0%, #0a2558 100%);
            border: 3px solid #85b3ff;
            color: #ffffff;
            font-family: 'Cinzel Decorative', serif;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(30, 98, 208, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .btn-battle:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(60, 130, 250, 1), inset 0 0 20px rgba(255, 255, 255, 0.6);
            border-color: #ffffff;
        }

        /* マッチング中（キャンセル）表示用オーバーレイ */
        #matching-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 100; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 60px; height: 60px; border: 4px solid rgba(201,160,80,0.2);
            border-top: 4px solid #c9a050; border-radius: 50%; animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* フッターナビゲーション */
        footer {
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(12, 8, 18, 0.95); border-top: 1px solid #3d2f4d; padding: 8px 0; z-index: 10;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; color: #7a688d; font-size: 11px; cursor: pointer; text-decoration: none; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { color: #c9a050; }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <button class="btn-back" onclick="location.href='home.html'">❮ ランダムマッチ</button>
        <div class="header-title">RANK MATCH</div>
    </header>

    <!-- メインフレーム -->
    <div class="main-container">
        <!-- 左タブ -->
        <div class="sidebar-tabs">
            <div class="tab-item active">
                <span class="tab-icon">⚔️</span>
                <span>ランクマッチ</span>
            </div>
            <div class="tab-item">
                <span class="tab-icon">🛡️</span>
                <span>スターター</span>
            </div>
        </div>

        <!-- 中央：モード詳細＆デッキ指定 -->
        <div class="center-section">
            <div>
                <div class="mode-header">
                    <h3>ランクマッチ</h3>
                    <div class="mode-desc">ランクをかけて争うランダムマッチング戦</div>
                </div>

                <!-- フォーマット選択 -->
                <div class="format-selector">
                    <div class="format-btn active" onclick="setFormat(this, 'rotation')">
                        <span>ローテーション</span>
                        <span class="radio-dot"></span>
                    </div>
                    <div class="format-btn" onclick="setFormat(this, 'unlimited')">
                        <span>アンリミテッド</span>
                        <span class="radio-dot"></span>
                    </div>
                </div>
            </div>

            <!-- 使用デッキ＆ステージ選択 -->
            <div class="settings-bottom">
                <div class="setting-box">
                    <div class="setting-label">
                        <span>使用デッキ</span>
                        <button class="btn-confirm" onclick="location.href='deck.html'">確認</button>
                    </div>
                    <div class="deck-preview-card" id="current-deck-name">
                        ミッドレンジ貴族
                    </div>
                </div>

                <div class="setting-box">
                    <div class="setting-label">
                        <span>ステージ</span>
                    </div>
                    <div class="stage-preview-card">
                        シンプルステージ
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：ランク情報＆バトルボタン -->
        <div class="right-section">
            <div style="width: 100%;">
                <div class="rank-info">
                    <div class="rank-badge">🏆</div>
                    <div class="rank-name">Master 1</div>
                </div>

                <!-- MPゲージ -->
                <div class="mp-container">
                    <div class="mp-header">
                        <span>MP</span>
                        <span>5877</span>
                    </div>
                    <div class="mp-bar-bg">
                        <div class="mp-bar-fill"></div>
                    </div>
                    <div class="mp-next">NEXT 4123</div>
                </div>
            </div>

            <!-- バトルボタン -->
            <div class="battle-btn-container">
                <button class="btn-battle" onclick="startMatchmaking()">
                    <span>バトル</span>
                </button>
            </div>
        </div>
    </div>

    <!-- マッチング中（キャンセル）オーバーレイ画面 -->
    <div id="matching-overlay" class="overlay-screen">
        <div style="font-family: 'Cinzel Decorative', serif; font-size: 24px; color: #c9a050; margin-bottom: 10px;">
            MATCHING IN PROGRESS
        </div>
        <div style="font-size: 14px; color: #a792ba; margin-bottom: 30px;">対戦相手を探しています...</div>
        <div class="spinner"></div>
        <button class="btn-back" onclick="cancelMatchmaking()" style="padding: 8px 30px; font-size: 15px;">
            キャンセル
        </button>
    </div>

    <!-- フッターナビゲーション -->
    <footer>
        <a class="nav-item" href="solo.html">
            <span class="nav-icon">📖</span>
            <span>ソロプレイ</span>
        </a>
        <a class="nav-item active" href="rank_match.html">
            <span class="nav-icon">⚔️</span>
            <span>バトル</span>
        </a>
        <a class="nav-item" href="home.html">
            <span class="nav-icon">🏠</span>
            <span>ホーム</span>
        </a>
        <a class="nav-item" href="deck.html">
            <span class="nav-icon">🎴</span>
            <span>カード</span>
        </a>
    </footer>

    <script>
        let matchTimer = null;

        function setFormat(element, mode) {
            document.querySelectorAll('.format-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        // バトルボタンを押すとマッチング待機画面を表示し、3秒後に対戦画面（battle.html）へ遷移
        function startMatchmaking() {
            document.getElementById('matching-overlay').style.display = 'flex';
            matchTimer = setTimeout(() => {
                window.location.href = 'battle.html';
            }, 3000);
        }

        // キャンセルボタン
        function cancelMatchmaking() {
            if (matchTimer) {
                clearTimeout(matchTimer);
                matchTimer = null;
            }
            document.getElementById('matching-overlay').style.display = 'none';
        }

        // 保存されたデッキ名の自動反映
        document.addEventListener('DOMContentLoaded', () => {
            const savedDecks = localStorage.getItem('userDecksList');
            if (savedDecks) {
                try {
                    const decks = JSON.parse(savedDecks);
                    if (decks.length > 0) {
                        document.getElementById('current-deck-name').innerText = decks[0].name || 'デッキ 1';
                    }
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
