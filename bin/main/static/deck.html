<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic Duel - デッキ編成</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'EB Garamond', serif;
            background: #0d0914;
            background-image: radial-gradient(circle at 50% 30%, rgba(45, 27, 78, 0.4) 0%, transparent 70%);
            color: #e0d8e8;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(22, 16, 35, 0.9);
            padding: 15px 20px;
            border: 1px solid #4a3e56;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        h2, h3, h4 {
            font-family: 'Cinzel Decorative', serif;
            margin: 0;
            color: #c9a050;
            text-shadow: 0 0 8px rgba(201, 160, 80, 0.3);
        }

        .btn {
            font-family: 'EB Garamond', serif;
            background: linear-gradient(135deg, #2b1a3a 0%, #150b21 100%);
            color: #c9a050;
            border: 1px solid #c9a050;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #c9a050;
            color: #0d0914;
            box-shadow: 0 0 10px rgba(201, 160, 80, 0.5);
        }

        /* --- 1. デッキ一覧画面 --- */
        #view-deck-list {
            display: block;
        }
        .deck-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .deck-card {
            background: rgba(22, 16, 35, 0.85);
            border: 1px solid #4a3e56;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .deck-card:hover {
            border-color: #c9a050;
            transform: translateY(-4px);
            box-shadow: 0 0 15px rgba(201, 160, 80, 0.3);
        }
        .deck-card.create-new {
            border: 2px dashed #6c5383;
            background: rgba(15, 10, 23, 0.5);
        }
        .deck-card.create-new:hover {
            border-color: #c9a050;
            background: rgba(45, 27, 78, 0.3);
        }

        /* --- モーダル (ポップアップ) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: rgba(22, 16, 35, 0.95);
            border: 2px solid #c9a050;
            border-radius: 12px;
            padding: 25px;
            width: 90%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 0 25px rgba(201, 160, 80, 0.4);
        }
        .modal-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .modal-btn {
            padding: 12px;
            background: #181124;
            border: 1px solid #6c5383;
            color: #f1e6cf;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-btn:hover {
            border-color: #c9a050;
            background: #2b1a3a;
            color: #c9a050;
        }

        /* クラス選択グリッド */
        .class-select-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .class-option {
            background: #181124;
            border: 1px solid #6c5383;
            padding: 12px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .class-option:hover, .class-option.selected {
            border-color: #c9a050;
            background: #c9a050;
            color: #0d0914;
        }

        /* --- 2. デッキ構築エディタ画面 --- */
        #view-deck-editor {
            display: none;
        }
        .editor-container {
            display: flex;
            gap: 20px;
        }
        .card-pool, .deck-pool {
            background: rgba(22, 16, 35, 0.85);
            border: 1px solid #4a3e56;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            min-height: 500px;
            max-height: 75vh;
            overflow-y: auto;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        .card-item {
            background: linear-gradient(145deg, #181124, #0f0a17);
            border: 1px solid #6c5383;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .card-item:hover {
            transform: translateY(-4px);
            border-color: #c9a050;
            box-shadow: 0 0 10px rgba(201, 160, 80, 0.4);
        }
        .card-cost {
            position: absolute;
            top: 5px; left: 5px;
            background: #c9a050;
            color: #0d0914;
            font-weight: bold;
            border-radius: 50%;
            width: 20px; height: 20px;
            line-height: 20px;
            font-size: 11px;
        }
        .card-class-badge { font-size: 10px; color: #a792ba; margin-top: 10px; }
        .card-name { font-weight: bold; margin: 4px 0; font-size: 12px; color: #f1e6cf; }
        .card-stats { font-size: 12px; color: #e0d8e8; }
    </style>
</head>
<body>

<!-- 画面ヘッダー -->
<header>
    <h2 id="page-title">🎴 デッキ編成</h2>
    <div id="header-btns">
        <button class="btn" onclick="location.href='home.html'">🏠 ホームへ戻る</button>
    </div>
</header>

<!-- ステップ 1: 作成済みデッキ一覧画面 -->
<div id="view-deck-list">
    <h3>保存済みデッキ</h3>
    <div id="saved-decks-container" class="deck-grid">
        <!-- JSで動的描画＋新規作成カード -->
    </div>
</div>

<!-- ステップ 2: デッキ作成方法選択 モーダル -->
<div id="modal-method" class="modal-overlay">
    <div class="modal-content">
        <h3>デッキ新規作成</h3>
        <p style="margin-top: 10px; color: #a792ba;">作成方法を選択してください</p>
        <div class="modal-btns">
            <button class="modal-btn" onclick="selectMethod('manual')">✨ 新規作成</button>
            <button class="modal-btn" onclick="selectMethod('auto')">🎲 おまかせ編成</button>
        </div>
        <button class="btn" style="margin-top: 20px; width: 100%;" onclick="closeModals()">閉じる</button>
    </div>
</div>

<!-- ステップ 3: クラス選択 モーダル -->
<div id="modal-class" class="modal-overlay">
    <div class="modal-content">
        <h3>クラス選択</h3>
        <p style="margin-top: 10px; color: #a792ba;">使用するクラスを選択してください</p>
        
        <div class="class-select-grid">
            <div class="class-option" onclick="selectClass('貴族', this)">貴族</div>
            <div class="class-option" onclick="selectClass('怪物', this)">怪物</div>
            <div class="class-option" onclick="selectClass('幽霊', this)">幽霊</div>
            <div class="class-option" onclick="selectClass('魔女', this)">魔女</div>
            <div class="class-option" onclick="selectClass('人形', this)">人形</div>
            <div class="class-option" onclick="selectClass('狩人', this)">狩人</div>
            <div class="class-option" onclick="selectClass('海賊', this)">海賊</div>
        </div>

        <button class="btn" style="width: 100%; margin-top: 10px;" onclick="startBuilding()">決定して編集開始</button>
        <button class="btn" style="width: 100%; margin-top: 8px; background: transparent; border-color: #6c5383;" onclick="closeModals()">キャンセル</button>
    </div>
</div>

<!-- ステップ 4: デッキ構築エディタ画面 -->
<div id="view-deck-editor">
    <div class="editor-container">
        <div class="card-pool">
            <h3>使用可能カード (<span id="selected-class-name"></span> + 無所属)</h3>
            <div id="available-cards" class="card-grid"></div>
        </div>
        
        <div class="deck-pool">
            <h3>編成中デッキ (<span id="deck-count">0</span>/20)</h3>
            <div id="deck-cards" class="card-grid"></div>
        </div>
    </div>
</div>

<script>
    let allCards = [];
    let selectedClass = '';
    let buildMethod = '';
    let currentDeck = [];
    let savedDecks = [];

    document.addEventListener('DOMContentLoaded', () => {
        // 保存済みデッキ読み込み
        const localDecks = localStorage.getItem('userDecksList');
        if (localDecks) {
            try { savedDecks = JSON.parse(localDecks); } catch(e) { savedDecks = []; }
        }
        renderDeckList();

        // 全カードデータ取得
        fetch('/api/cards')
            .then(res => res.json())
            .then(cards => { allCards = cards; })
            .catch(() => {
                // フォールバック用ダミーデータ（各クラス＋無所属）
                allCards = [
                    { id: 1, cardClass: '貴族', name: '暗黒の騎士', cost: 1, attack: 1, maxHp: 2 },
                    { id: 2, cardClass: '怪物', name: '吸血狼', cost: 2, attack: 2, maxHp: 2 },
                    { id: 3, cardClass: '幽霊', name: 'ポルターガイスト', cost: 1, attack: 1, maxHp: 1 },
                    { id: 4, cardClass: '魔女', name: '月影の魔導士', cost: 2, attack: 2, maxHp: 2 },
                    { id: 5, cardClass: '人形', name: '自動人形', cost: 2, attack: 2, maxHp: 3 },
                    { id: 6, cardClass: '狩人', name: '銀弾の狩人', cost: 3, attack: 4, maxHp: 2 },
                    { id: 7, cardClass: '海賊', name: '亡霊船長', cost: 5, attack: 5, maxHp: 5 },
                    { id: 8, cardClass: '無所属', name: '傭兵の剣士', cost: 1, attack: 1, maxHp: 1 },
                    { id: 9, cardClass: '無所属', name: '回復の薬', cost: 2, attack: 0, maxHp: 0 }
                ];
            });
    });

    // 1. デッキ一覧描画
    function renderDeckList() {
        const container = document.getElementById('saved-decks-container');
        container.innerHTML = '';

        // 保存済みデッキを表示
        savedDecks.forEach((deck, index) => {
            const card = document.createElement('div');
            card.className = 'deck-card';
            card.innerHTML = `
                <h4>${deck.name || 'デッキ ' + (index + 1)}</h4>
                <div style="color: #c9a050; font-size: 13px; margin-top: 5px;">クラス: ${deck.cardClass}</div>
                <div style="font-size: 12px; color: #a792ba;">${deck.cards.length} 枚</div>
            `;
            card.onclick = () => loadExistingDeck(index);
            container.appendChild(card);
        });

        // 新規作成カードを追加
        const newCard = document.createElement('div');
        newCard.className = 'deck-card create-new';
        newCard.innerHTML = `<h3 style="color: #c9a050;">＋ 新規作成</h3>`;
        newCard.onclick = openMethodModal;
        container.appendChild(newCard);
    }

    // モーダル開閉制御
    function openMethodModal() {
        document.getElementById('modal-method').style.display = 'flex';
    }
    function closeModals() {
        document.getElementById('modal-method').style.display = 'none';
        document.getElementById('modal-class').style.display = 'none';
    }

    // 2. 作成方法の選択（新規 or おまかせ）
    function selectMethod(method) {
        buildMethod = method;
        document.getElementById('modal-method').style.display = 'none';
        document.getElementById('modal-class').style.display = 'flex';
    }

    // 3. クラス選択
    function selectClass(className, element) {
        selectedClass = className;
        document.querySelectorAll('.class-option').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
    }

    // 4. デッキ構築画面へ遷移・初期化
    function startBuilding() {
        if (!selectedClass) return alert('クラスを選択してください！');
        
        closeModals();
        document.getElementById('view-deck-list').style.display = 'none';
        document.getElementById('view-deck-editor').style.display = 'block';

        // ヘッダーボタンの更新
        document.getElementById('page-title').innerText = `🎴 デッキ構築 (${selectedClass})`;
        document.getElementById('header-btns').innerHTML = `
            <button class="btn" onclick="saveCurrentDeck()">💾 デッキ保存</button>
            <button class="btn" onclick="backToDeckList()">↩ 一覧へ戻る</button>
        `;

        document.getElementById('selected-class-name').innerText = selectedClass;

        // 対象クラス ＋ 無所属 のカードを抽出
        const usableCards = allCards.filter(card => {
            const cls = card.cardClass || card.class;
            return cls === selectedClass || cls === '無所属' || !cls;
        });

        currentDeck = [];

        // 「おまかせ編成」の場合はランダムに20枚選定
        if (buildMethod === 'auto') {
            while (currentDeck.length < 20 && usableCards.length > 0) {
                const randCard = usableCards[Math.floor(Math.random() * usableCards.length)];
                currentDeck.push(randCard);
            }
        }

        renderCardPool(usableCards);
        renderDeck();
    }

    // 既存デッキの編集読み込み
    function loadExistingDeck(index) {
        const deck = savedDecks[index];
        selectedClass = deck.cardClass;
        currentDeck = [...deck.cards];

        document.getElementById('view-deck-list').style.display = 'none';
        document.getElementById('view-deck-editor').style.display = 'block';

        document.getElementById('page-title').innerText = `🎴 デッキ編集 (${selectedClass})`;
        document.getElementById('header-btns').innerHTML = `
            <button class="btn" onclick="saveCurrentDeck(${index})">💾 デッキ保存</button>
            <button class="btn" onclick="backToDeckList()">↩ 一覧へ戻る</button>
        `;

        document.getElementById('selected-class-name').innerText = selectedClass;

        const usableCards = allCards.filter(card => {
            const cls = card.cardClass || card.class;
            return cls === selectedClass || cls === '無所属' || !cls;
        });

        renderCardPool(usableCards);
        renderDeck();
    }

    // カードプール表示
    function renderCardPool(cards) {
        const container = document.getElementById('available-cards');
        container.innerHTML = '';
        cards.forEach(card => {
            const el = document.createElement('div');
            el.className = 'card-item';
            el.onclick = () => addToDeck(card);
            el.innerHTML = `
                <div class="card-cost">${card.cost || 1}</div>
                <div class="card-class-badge">[${card.cardClass || '無所属'}]</div>
                <div class="card-name">${card.name}</div>
                <div class="card-stats">⚔ ${card.attack} / ❤ ${card.maxHp || card.defense || 1}</div>
            `;
            container.appendChild(el);
        });
    }

    // デッキ表示
    function renderDeck() {
        const container = document.getElementById('deck-cards');
        container.innerHTML = '';
        document.getElementById('deck-count').innerText = currentDeck.length;

        currentDeck.forEach((card, index) => {
            const el = document.createElement('div');
            el.className = 'card-item';
            el.onclick = () => removeFromDeck(index);
            el.innerHTML = `
                <div class="card-cost">${card.cost || 1}</div>
                <div class="card-class-badge">[${card.cardClass || '無所属'}]</div>
                <div class="card-name">${card.name}</div>
                <div class="card-stats">⚔ ${card.attack} / ❤ ${card.maxHp || card.defense || 1}</div>
            `;
            container.appendChild(el);
        });
    }

    function addToDeck(card) {
        if (currentDeck.length >= 20) return alert('デッキは最大20枚までです！');
        currentDeck.push(card);
        renderDeck();
    }

    function removeFromDeck(index) {
        currentDeck.splice(index, 1);
        renderDeck();
    }

    // 保存処理
    function saveCurrentDeck(existingIndex = -1) {
        if (currentDeck.length === 0) return alert('デッキにカードがありません！');

        const deckData = {
            name: `${selectedClass} デッキ`,
            cardClass: selectedClass,
            cards: currentDeck
        };

        if (existingIndex >= 0) {
            savedDecks[existingIndex] = deckData;
        } else {
            savedDecks.push(deckData);
        }

        localStorage.setItem('userDecksList', JSON.stringify(savedDecks));
        alert('デッキを保存しました！');
        backToDeckList();
    }

    function backToDeckList() {
        document.getElementById('view-deck-editor').style.display = 'none';
        document.getElementById('view-deck-list').style.display = 'block';
        document.getElementById('page-title').innerText = '🎴 デッキ編成';
        document.getElementById('header-btns').innerHTML = `
            <button class="btn" onclick="location.href='home.html'">🏠 ホームへ戻る</button>
        `;
        renderDeckList();
    }
</script>

</body>
</html>
