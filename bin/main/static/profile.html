<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic Duel - プロフィール</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'EB Garamond', serif;
            background: #080d19;
            color: #e0d8e8;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ヘッダー */
        header {
            display: flex; align-items: center; padding: 12px 25px;
            background: rgba(15, 10, 23, 0.9); border-bottom: 1px solid rgba(201, 160, 80, 0.3);
        }
        .btn-back {
            background: rgba(45, 27, 78, 0.6); border: 1px solid #c9a050; color: #c9a050;
            padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn-back:hover { background: #2b1a3a; color: #fff; }

        /* メインコンテナ */
        .profile-container {
            flex: 1; margin: 15px 30px; display: grid; grid-template-columns: 280px 1fr; gap: 20px;
        }

        /* 左パネル */
        .profile-left-box {
            background: rgba(18, 12, 28, 0.9); border: 1px solid rgba(201, 160, 80, 0.4); border-radius: 10px;
            padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center;
        }
        .prof-avatar {
            width: 100px; height: 100px; border-radius: 50%; border: 3px solid #c9a050;
            background: #1a1028; font-size: 50px; display: flex; justify-content: center; align-items: center;
            margin-bottom: 12px; box-shadow: 0 0 15px rgba(201, 160, 80, 0.4);
        }

        /* プレイヤー名表示＆編集領域 */
        .name-container {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: 12px; width: 100%;
        }
        .prof-name {
            font-size: 18px; font-weight: bold; color: #f1e6cf;
            font-family: 'Cinzel Decorative', serif;
            max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .btn-edit-name {
            background: rgba(201, 160, 80, 0.2); border: 1px solid #c9a050; color: #c9a050;
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 12px;
            transition: all 0.2s;
        }
        .btn-edit-name:hover {
            background: #c9a050; color: #080d19; transform: scale(1.1);
        }

        .title-badge {
            background: linear-gradient(135deg, #4a1d6d, #230d35); border: 1px solid #c9a050;
            color: #ffd700; padding: 6px 20px; border-radius: 20px; font-size: 12px; font-weight: bold;
            margin-bottom: 15px;
        }

        /* 右パネル */
        .profile-right-box {
            background: rgba(18, 12, 28, 0.9); border: 1px solid rgba(201, 160, 80, 0.4); border-radius: 10px;
            padding: 20px; display: flex; flex-direction: column; gap: 12px;
        }
        .info-card {
            background: rgba(12, 8, 18, 0.7); border: 1px solid rgba(201, 160, 80, 0.2);
            border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .rank-title-display { font-family: 'Cinzel Decorative', serif; font-size: 20px; color: #ffd700; font-weight: bold; }
        
        /* 7クラス別勝利数グラフ */
        .class-wins-section {
            background: rgba(12, 8, 18, 0.7); border: 1px solid rgba(201, 160, 80, 0.2);
            border-radius: 8px; padding: 12px 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between;
        }
        .chart-bars {
            display: flex; justify-content: space-around; align-items: flex-end; height: 95px; padding: 0 10px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; width: 36px; color: #d0c4de; }
        .bar-fill { width: 14px; border-radius: 3px 3px 0 0; transition: height 0.4s; }
        .bar-num { font-size: 10px; color: #c9a050; }

        /* 名前変更用モーダル */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(6px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .edit-modal {
            background: rgba(18, 12, 28, 0.95); border: 2px solid #c9a050; border-radius: 12px;
            padding: 24px; width: 320px; text-align: center; box-shadow: 0 0 25px rgba(201, 160, 80, 0.4);
        }
        .edit-input {
            width: 100%; padding: 10px; margin: 15px 0; background: #080d19; border: 1px solid #4a3e56;
            border-radius: 6px; color: #fff; font-size: 14px; text-align: center; outline: none;
        }
        .edit-input:focus { border-color: #c9a050; }

        footer {
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(12, 8, 18, 0.95); border-top: 1px solid rgba(201, 160, 80, 0.3); padding: 10px 0;
        }
        .nav-item { color: #a792ba; font-size: 13px; text-decoration: none; font-weight: bold; cursor: pointer; }
        .nav-item:hover { color: #ffd700; }
    </style>
</head>
<body>

    <header>
        <button class="btn-back" onclick="location.href='home.html'">❮ ホームへ戻る</button>
    </header>

    <div class="profile-container">
        <!-- 左カラム -->
        <div class="profile-left-box">
            <div class="prof-avatar">👤</div>
            
            <!-- プレイヤー名 ＆ 編集ボタン -->
            <div class="name-container">
                <div class="prof-name" id="prof-username">プレイヤー</div>
                <button class="btn-edit-name" onclick="openNameModal()" title="名前を変更">✏️</button>
            </div>

            <div class="title-badge">吊 歌</div>
            <button class="btn-back" style="width: 100%; margin-top: auto;" onclick="alert('スキン変更機能は未実装です')">スキン変更</button>
        </div>

        <!-- 右カラム -->
        <div class="profile-right-box">
            <!-- ランク情報 -->
            <div class="info-card">
                <div>
                    <div style="font-size: 11px; color: #a792ba; margin-bottom: 2px;">ランクマッチ</div>
                    <div class="rank-title-display" id="prof-rank-name">Beginner 0</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 15px; color: #ffd700; font-weight: bold;" id="prof-mp-text">MP 0</div>
                    <div style="font-size: 11px; color: #a792ba;" id="prof-next-mp">NEXT昇格まで あと 200 MP</div>
                </div>
            </div>

            <!-- 所属グループ情報（エメラルド〜ダイヤモンド） -->
            <div class="info-card" style="border-color: rgba(72, 187, 120, 0.3);">
                <div>
                    <div style="font-size: 11px; color: #a792ba; margin-bottom: 2px;">所属グループ</div>
                    <div style="font-family: 'Cinzel Decorative', serif; font-size: 18px; font-weight: bold;" id="prof-group-name">🟢 エメラルド</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 13px; color: #ffd700; font-weight: bold;" id="prof-group-bonus">勝利時 MP +100</div>
                    <div style="font-size: 11px; color: #a792ba;" id="prof-win-streak">0 連勝中</div>
                </div>
            </div>

            <!-- 7クラス別勝利数グラフ -->
            <div class="class-wins-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <span style="font-size: 13px; color: #c9a050; font-weight: bold;">ランクマッチ：クラス別勝利数</span>
                    <span style="font-size: 13px; color: #f1e6cf;">総勝利数: <strong id="total-wins" style="color:#ffd700;">0</strong></span>
                </div>

                <div class="chart-bars">
                    <div class="bar-col"><span class="bar-num" id="win-noble">0</span><div class="bar-fill" id="bar-noble" style="height: 0px; background: #ecc94b;"></div><span>貴族</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-monster">0</span><div class="bar-fill" id="bar-monster" style="height: 0px; background: #ed8936;"></div><span>怪物</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-ghost">0</span><div class="bar-fill" id="bar-ghost" style="height: 0px; background: #a0aec0;"></div><span>幽霊</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-witch">0</span><div class="bar-fill" id="bar-witch" style="height: 0px; background: #9f7aea;"></div><span>魔女</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-doll">0</span><div class="bar-fill" id="bar-doll" style="height: 0px; background: #f687b3;"></div><span>人形</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-hunter">0</span><div class="bar-fill" id="bar-hunter" style="height: 0px; background: #48bb78;"></div><span>狩人</span></div>
                    <div class="bar-col"><span class="bar-num" id="win-pirate">0</span><div class="bar-fill" id="bar-pirate" style="height: 0px; background: #319795;"></div><span>海賊</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 名前変更ダイアログ -->
    <div id="name-modal" class="modal-overlay">
        <div class="edit-modal">
            <div style="color: #c9a050; font-weight: bold; font-size: 16px;">プレイヤー名の変更</div>
            <input type="text" id="new-name-input" class="edit-input" maxlength="12" placeholder="新しい名前を入力">
            <div style="display: flex; gap: 10px;">
                <button class="btn-back" style="flex: 1;" onclick="closeNameModal()">キャンセル</button>
                <button class="btn-back" style="flex: 1; background: #c9a050; color: #080d19;" onclick="saveName()">保存</button>
            </div>
        </div>
    </div>

    <footer>
        <a class="nav-item" href="home.html">🏠 ホームへ戻る</a>
    </footer>

    <!-- ランク・グループ判定スクリプト -->
    <script src="js/rank_util.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
        });

        function loadUserData() {
            const storedUser = localStorage.getItem('user');
            if (!storedUser) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const user = JSON.parse(storedUser);
                const userMp = user.mp || 0;
                const winStreak = user.winStreak || 0;

                // 1. ランク情報の動的計算
                const rankInfo = typeof getRankInfo === 'function' ? getRankInfo(userMp) : { name: 'Beginner 0', nextMp: 200 };
                document.getElementById('prof-username').innerText = user.username || 'プレイヤー';
                document.getElementById('prof-rank-name').innerText = rankInfo.name;
                document.getElementById('prof-mp-text').innerText = 'MP ' + userMp;
                document.getElementById('prof-next-mp').innerText = 'NEXT あと ' + rankInfo.nextMp + ' MP';

                // 2. グループ情報の動的計算 (エメラルド / トパーズ / ルビー...)
                const groupInfo = typeof getGroupInfo === 'function' ? getGroupInfo(winStreak) : { name: 'エメラルド', mpBonus: 100, icon: '🟢', color: '#48bb78' };
                document.getElementById('prof-group-name').innerHTML = `${groupInfo.icon} <span style="color:${groupInfo.color}">${groupInfo.name}</span>`;
                document.getElementById('prof-group-bonus').innerText = `勝利時 MP +${groupInfo.mpBonus}`;
                document.getElementById('prof-win-streak').innerText = `${winStreak} 連勝中`;

                // 3. 7クラス勝利数データの反映
                const wins = user.classWins || {
                    noble: 0, monster: 0, ghost: 0, witch: 0, doll: 0, hunter: 0, pirate: 0
                };

                const classes = ['noble', 'monster', 'ghost', 'witch', 'doll', 'hunter', 'pirate'];
                let total = 0;
                let maxWin = 1;

                classes.forEach(c => {
                    const count = wins[c] || 0;
                    total += count;
                    if (count > maxWin) maxWin = count;
                });

                classes.forEach(c => {
                    const count = wins[c] || 0;
                    document.getElementById(`win-${c}`).innerText = count;
                    const height = count === 0 ? 0 : Math.max(10, Math.min(85, Math.round((count / maxWin) * 85)));
                    document.getElementById(`bar-${c}`).style.height = `${height}px`;
                });

                document.getElementById('total-wins').innerText = total;

            } catch (e) {
                console.error(e);
            }
        }

        // --- 名前変更モーダルのロジック ---
        function openNameModal() {
            const currentName = document.getElementById('prof-username').innerText;
            document.getElementById('new-name-input').value = currentName;
            document.getElementById('name-modal').style.display = 'flex';
        }

        function closeNameModal() {
            document.getElementById('name-modal').style.display = 'none';
        }

        function saveName() {
            const inputVal = document.getElementById('new-name-input').value.trim();
            if (!inputVal) {
                alert('名前を入力してください。');
                return;
            }

            let user = JSON.parse(localStorage.getItem('user') || '{}');
            user.username = inputVal;
            localStorage.setItem('user', JSON.stringify(user));

            document.getElementById('prof-username').innerText = inputVal;
            closeNameModal();
        }
    </script>
</body>
</html>
